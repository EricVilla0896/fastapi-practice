services:
  api:
    image: ghcr.io/ericvilla0896/fastapi-practice:latest
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: api_practice
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_practice
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db_schema/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql
      - ./db_schema/fast_api_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  postgres_data: