services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: api_practice
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_practice
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db_schema/fast_api_schema.sql:/docker-entrypoint-initdb.d/fast_api_schema.sql
volumes:
  postgres_data: