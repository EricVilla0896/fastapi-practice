name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_practice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_practice"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Create database schema
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: api_practice
        run: |
          psql -c "CREATE SCHEMA api_practice_schema;"

          psql -c "CREATE TABLE api_practice_schema.applications (
            id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            company varchar(100) NOT NULL,
            position varchar(100) NOT NULL,
            salary integer NOT NULL
          );"

          psql -c "CREATE TABLE api_practice_schema.webhook_events (
            id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            event_id varchar(255) NOT NULL UNIQUE
          );"

          psql -c "CREATE TABLE api_practice_schema.analyzed_jobs (
            id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            title varchar(200) NOT NULL,
            company varchar(200) NOT NULL,
            description text NOT NULL,
            category varchar(100) NOT NULL,
            seniority varchar(50) NOT NULL,
            relevant boolean NOT NULL,
            reason text NOT NULL
          );"

      - name: Run tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: api_practice
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: python -m pytest

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ericvilla0896/fastapi-practice:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment configuration
        run: |
          mkdir -p ~/fastapi-deployment/db_schema
          cp docker-compose.yml ~/fastapi-deployment/compose.yml
          cp db_schema/00_extensions.sql ~/fastapi-deployment/db_schema/
          cp db_schema/fast_api_schema.sql ~/fastapi-deployment/db_schema/

      - name: Pull latest image
        run: docker pull ghcr.io/ericvilla0896/fastapi-practice:latest

      - name: Deploy API
        env:
          API_KEY: ${{ secrets.API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ~/fastapi-deployment
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml up -d --force-recreate api
          docker compose -f compose.yml ps